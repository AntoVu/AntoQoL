plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.4'
group = 'net.antoqol'
archivesBaseName = 'antoqol'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    // Client only: the mod references client classes, so there is no server run
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'mixin.debug.export', 'true'
            mods {
                antoqol { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'antoqol.refmap.json'
    config 'antoqol.mixins.json'
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation(fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.118"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Dev client only: Configured 2.2.3 opens the config screen from the Mods list
    runtimeOnly fg.deobf("curse.maven:configured-457570:5180900")}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "antoqol",
            "Specification-Vendor"    : "AntoQoL",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "AntoQoL",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "antoqol.mixins.json"
        ])
    }
}

// Fills ${version} in mods.toml; file.jarVersion only works from a built jar, not the dev client
processResources {
    inputs.property 'version', version
    // Plain replace, not expand(): the template engine would turn the description's \n escape into a newline
    filesMatching('META-INF/mods.toml') { filter { it.replace('${version}', project.version.toString()) } }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}